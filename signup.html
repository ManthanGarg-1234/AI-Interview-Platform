<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Account | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-shell single-auth">
        <section class="auth-card card"><a class="back-link" href="index.html">← Back to sign in</a>
            <div class="brand-mark">IO</div>
            <h2>Create your demo account</h2>
            <p class="muted">Register as a Student or HR user. Admin access is provisioned separately.</p>
            <div class="step-indicator"><span class="active" data-step-dot="1">1</span><i></i><span
                    data-step-dot="2">2</span><i></i><span data-step-dot="3">3</span></div>
            <form id="signup-form">
                <section data-step="1"><label for="signup-name">Full name</label><input id="signup-name" required><label
                        for="signup-email">Email address</label><input id="signup-email" type="email" required><label
                        for="signup-password">Password</label>
                    <div class="password-field"><input id="signup-password" type="password" required
                            minlength="8"><button type="button" class="password-toggle">Show</button></div>
                    <small>Password must be at least 8 characters.</small><label for="signup-confirm">Confirm
                        password</label><input id="signup-confirm" type="password" required><label
                        class="check-label"><input id="terms" type="checkbox" required> I understand this is a frontend
                        demo.</label><button class="button primary full next-step" type="button">Continue</button>
                </section>
                <section data-step="2" class="hidden"><label>Account type</label>
                    <div class="role-choice"><label><input type="radio" name="signup-role" value="candidate"
                                checked><span><strong>Student</strong><small>Build skills and practice
                                    interviews</small></span></label><label><input type="radio" name="signup-role"
                                value="recruiter"><span><strong>HR / Recruiter</strong><small>Publish roles and manage
                                    candidates</small></span></label></div>
                    <div class="form-actions"><button class="button secondary prev-step"
                            type="button">Back</button><button class="button primary next-step"
                            type="button">Continue</button></div>
                </section>
                <section data-step="3" class="hidden">
                    <div id="student-fields"><label for="signup-college">College / university</label><input
                            id="signup-college"><label for="signup-degree">Degree</label><input id="signup-degree"
                            placeholder="B.Tech Computer Science"><label for="signup-grad">Graduation year</label><input
                            id="signup-grad" type="number" min="2020" max="2100"></div>
                    <div id="hr-fields" class="hidden"><label for="signup-company">Company name</label><input
                            id="signup-company"><label for="signup-job-title">Job title</label><input
                            id="signup-job-title"><label for="signup-department">Department</label><input
                            id="signup-department"></div>
                    <div class="form-actions"><button class="button secondary prev-step"
                            type="button">Back</button><button class="button primary" type="submit">Create demo
                            account</button></div>
                </section>
            </form>
            <p id="signup-message" class="form-message"></p>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/signup.js"></script>
</body>

</html>

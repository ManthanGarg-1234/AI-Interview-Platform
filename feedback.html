<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Feedback Center | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-role="candidate">
    <div class="app-shell">
        <aside class="sidebar"><a class="side-brand" href="candidate.html"><span
                    class="brand-mark">CP</span><strong>CareerPrepAI</strong></a>
            <nav><a href="candidate.html">⌂ <span>Overview</span></a><a href="prep.html">▦ <span>Preparation
                        center</span></a><a class="active" href="feedback.html">↗ <span>Feedback center</span></a></nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div><span class="eyebrow">Continuous development</span>
                    <h1>Feedback center</h1>
                </div>
                <div class="top-actions"><button class="button icon-button theme-toggle"
                        title="Toggle theme">◐</button><button class="button ghost logout">Log out</button></div>
            </header>
            <section class="metric-grid">
                <div class="metric-card"><span class="metric-icon green">↗</span>
                    <div>
                        <p>Evidence activities</p><strong id="activity-count">0</strong>
                    </div>
                </div>
                <div class="metric-card"><span class="metric-icon purple">★</span>
                    <div>
                        <p>Average evidence score</p><strong id="evidence-score">—</strong>
                    </div>
                </div>
            </section>
            <section class="card table-card">
                <div class="section-heading">
                    <div><span class="eyebrow">Actionable recommendations</span>
                        <h2>What to do next</h2>
                    </div>
                </div>
                <div id="recommendations"></div>
            </section>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/feedback.js"></script>
</body>

</html>

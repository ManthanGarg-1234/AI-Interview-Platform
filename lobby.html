<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Interview Lobby | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-role="candidate">
    <main class="interview-shell">
        <header class="interview-top"><a class="side-brand" href="candidate.html"><span
                    class="brand-mark">CP</span><strong>CareerPrepAI</strong></a><span class="eyebrow">Pre-interview
                lobby</span><button class="button ghost logout">Log out</button></header>
        <section class="lobby-grid">
            <div class="card video-card"><video id="camera-preview" autoplay muted playsinline></video>
                <div class="video-controls"><button id="camera-button" class="button secondary">Enable
                        camera</button><button id="mic-button" class="button secondary">Enable microphone</button></div>
                <div id="device-message" class="notice">Camera and microphone stay off until you explicitly enable them.
                </div>
            </div>
            <div class="card profile-card"><span class="eyebrow">Interview details</span>
                <h2 id="lobby-title">Interview</h2>
                <div id="lobby-details"></div>
                <div class="warning-box">This prototype only provides a local device check. Two-way video requires a
                    configured WebRTC signaling backend.</div><button id="ready-button" class="button primary full">I am
                    ready</button>
            </div>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/lobby.js"></script>
</body>

</html>

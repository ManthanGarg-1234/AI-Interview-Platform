<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Demo Recovery | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-shell single-auth">
        <section class="auth-card card"><a class="back-link" href="index.html">← Back to sign in</a>
            <div class="brand-mark">IO</div>
            <h2>Account recovery</h2>
            <p class="muted">Enter your email to start the simulated recovery flow.</p>
            <form id="recovery-form"><label for="recovery-email">Email address</label><input id="recovery-email"
                    type="email" required><button class="button primary full" type="submit">Continue</button></form>
            <div id="recovery-message" class="notice hidden"></div>
            <p class="disclaimer">No email is sent. This demo cannot securely reset credentials because it has no
                backend or stored password.</p>
        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/recovery.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Profile | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar"><a class="side-brand" id="profile-home"><span
                    class="brand-mark">CP</span><strong>CareerPrepAI</strong></a>
            <nav><a class="active" href="profile.html">◎ <span>My profile</span></a><a href="account-settings.html">⚙
                    <span>Account settings</span></a></nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div><span class="eyebrow">Account</span>
                    <h1>Profile & identity</h1>
                </div>
                <div class="top-actions"><span class="role-pill" id="profile-role"></span><button
                        class="button ghost logout">Log out</button></div>
            </header>
            <div id="profile-message" class="notice hidden"></div>
            <section class="profile-layout">
                <div class="card profile-summary">
                    <div class="avatar-large" id="avatar-preview">◎</div>
                    <h2 id="profile-name"></h2>
                    <p class="muted" id="profile-headline"></p>
                    <div class="profile-meter"><strong id="completion-number">0%</strong><span>profile complete</span>
                    </div>
                    <div class="progress-bar"><span id="completion-fill"></span></div><label
                        class="button secondary upload-button">Change picture<input id="avatar-input" type="file"
                            accept="image/png,image/jpeg,image/webp"></label><small>Images are stored locally for this
                        demo.</small>
                </div>
                <div class="profile-sections">
                    <section class="card profile-card">
                        <div class="section-heading">
                            <div><span class="eyebrow">Identity</span>
                                <h2>Personal information</h2>
                            </div>
                        </div>
                        <form id="profile-form" class="form-grid"><label>Full name<input id="profile-full-name"
                                    required></label><label>Email<input id="profile-email" type="email"
                                    required></label><label>Phone<input id="profile-phone"></label><label>Location<input
                                    id="profile-location"></label><label class="wide">Professional headline<input
                                    id="profile-headline-input"></label><label class="wide">Bio<textarea
                                    id="profile-bio" rows="4"></textarea></label><label class="wide">Portfolio URL<input
                                    id="profile-portfolio" type="url" placeholder="https://example.com"></label>
                            <div class="wide form-actions"><button class="button primary" type="submit">Save
                                    profile</button></div>
                        </form>
                    </section>
                    <section class="card profile-card" id="student-profile-section">
                        <div class="section-heading">
                            <div><span class="eyebrow">Career readiness</span>
                                <h2>Student details</h2>
                            </div>
                        </div>
                        <form id="student-form" class="form-grid"><label>College / university<input
                                    id="education-college"></label><label>Degree<input
                                    id="education-degree"></label><label>Graduation year<input id="education-year"
                                    type="number" min="2020" max="2100"></label><label>Target job role<select
                                    id="target-role">
                                    <option>Java Developer</option>
                                    <option>Frontend Developer</option>
                                    <option>Data Structures and Algorithms</option>
                                </select></label><label class="wide">Skills <small>Comma-separated, self-declared until
                                    evidence exists.</small><input id="profile-skills"></label><label
                                class="wide">Career goals<textarea id="career-goals" rows="3"></textarea></label>
                            <div class="wide form-actions"><button class="button primary" type="submit">Save career
                                    details</button></div>
                        </form>
                    </section>
                    <section class="card profile-card hidden" id="recruiter-profile-section">
                        <div class="section-heading">
                            <div><span class="eyebrow">Recruiter identity</span>
                                <h2>Professional details</h2>
                            </div>
                        </div>
                        <form id="recruiter-form" class="form-grid"><label>Job title<input
                                    id="hr-job-title"></label><label>Department<input id="hr-department"></label><label
                                class="wide">Company name<input id="hr-company-name"></label><label class="wide">Company
                                website<input id="hr-company-website" type="url"></label>
                            <div class="wide form-actions"><button class="button primary" type="submit">Save recruiter
                                    details</button></div>
                        </form>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Interview History | CareerPrepAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-role="candidate">
    <div class="app-shell">
        <aside class="sidebar"><a class="side-brand" href="candidate.html"><span
                    class="brand-mark">CP</span><strong>CareerPrepAI</strong></a>
            <nav><a href="candidate.html">⌂ <span>Overview</span></a><a class="active" href="history.html">▣ <span>My
                        interviews</span></a></nav>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div><span class="eyebrow">Candidate workspace</span>
                    <h1>Interview history</h1>
                </div>
                <div class="top-actions"><button class="button icon-button theme-toggle">◐</button><button
                        class="button ghost logout">Log out</button></div>
            </header>
            <section class="card table-card">
                <div class="section-heading">
                    <div><span class="eyebrow">Performance archive</span>
                        <h2>Compare your attempts</h2>
                    </div>
                    <div class="filters"><input id="history-search" type="search"
                            placeholder="Search role or topic"><select id="history-sort">
                            <option value="date">Newest first</option>
                            <option value="score">Highest score</option>
                        </select></div>
                </div>
                <div id="history-table"></div>
            </section>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/history.js"></script>
</body>

</html>
